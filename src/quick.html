<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://translate.googleapis.com; media-src https://translate.google.com; img-src 'self' data:">
  <title>빠른 분석</title>
  <style>
    html, body { margin: 0; overflow: hidden; width: 100%; height: 100%; }
    html { background: transparent; }
    body { background: rgba(0, 0, 0, 0.012); }
    /* 화면 글자 인식 */
    .cap { position: fixed; inset: 0; z-index: 10; cursor: crosshair; background-size: 100% 100%; user-select: none; }
    .cap-dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); }
    .cap-sel { position: absolute; border: 2px solid #ef4444; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35); background-size: inherit; display: none; }
    .cap-hint { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); background: #18181b; color: #fff; padding: 9px 16px;
      border-radius: 999px; font: 14px/1.4 system-ui, "Malgun Gothic", sans-serif; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .ocr-box { position: fixed; z-index: 20; width: min(520px, calc(100vw - 24px)); background: #ffffff; color: #18181b; border: 1px solid #e4e4e7;
      border-radius: 14px; box-shadow: 0 12px 40px rgba(28,25,23,.25); padding: 12px 14px; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
    .ocr-box .t { font-size: 12px; font-weight: 700; color: #78716c; margin-bottom: 6px; }
    .ocr-box textarea { width: 100%; box-sizing: border-box; min-height: 64px; max-height: 40vh; resize: vertical; font: 18px/1.5 "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      border: 1px solid #e4e4e7; border-radius: 9px; padding: 8px 10px; background: #fff; color: inherit; }
    .ocr-box textarea:focus { outline: 2px solid #dc2626; outline-offset: -1px; }
    .ocr-box .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; align-items: center; }
    .ocr-box .row span { margin-right: auto; font-size: 12px; color: #78716c; }
    .ocr-box button { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid #e4e4e7; background: #fff; color: inherit; padding: 6px 12px; border-radius: 8px; }
    .ocr-box button.primary { background: #dc2626; border-color: #dc2626; color: #fff; font-weight: 600; }
    .ocr-busy { position: fixed; z-index: 20; background: #18181b; color: #fff; padding: 8px 14px; border-radius: 999px; font: 13px system-ui, "Malgun Gothic", sans-serif; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) .ocr-box { background: #1b1b1e; color: #f4f4f5; border-color: #2e2e33; }
      html:not([data-theme="light"]) .ocr-box textarea, html:not([data-theme="light"]) .ocr-box button { background: #232327; border-color: #2e2e33; }
      html:not([data-theme="light"]) .ocr-box button.primary { background: #f87171; border-color: #f87171; color: #18181b; }
    }
    html[data-theme="dark"] .ocr-box { background: #1b1b1e; color: #f4f4f5; border-color: #2e2e33; }
    html[data-theme="dark"] .ocr-box textarea, html[data-theme="dark"] .ocr-box button { background: #232327; border-color: #2e2e33; }
    html[data-theme="dark"] .ocr-box button.primary { background: #f87171; border-color: #f87171; color: #18181b; }
  </style>
</head>
<body>
  <script src="shim.js"></script>
  <script src="lib/pinyin-pro.js"></script>
  <script src="lib/hanja-data.js"></script>
  <script src="background.js"></script>
  <script src="content.js"></script>
  <script src="ocr/tesseract.min.js"></script>
  <script src="ocr.js"></script>
  <script src="quick.js"></script>
</body>
</html>
