# main 에 올라온 package.json 의 버전으로 릴리스가 아직 없으면
# Windows 와 맥(Apple Silicon)에서 각각 빌드해서 GitHub 릴리스(v<버전>)를 만든다.
# 앱의 자동 업데이트가 이 릴리스를 받는다. 맥 빌드가 실패해도 Windows 릴리스는 나간다.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.exists.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} 릴리스가 이미 있어 건너뜁니다."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        shell: bash
        run: |
          npm ci
          npx electron-builder --win zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ZhKoStudy-*-win-x64.zip
          if-no-files-found: error

  mac:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (Translation API 는 macOS 26 SDK 필요)
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Build Apple Translation helper
        run: |
          npm run build:mac-helper
          file build/mac/zhko-translate
          # 실행해서 상태 한 줄이 나오는지 확인 (러너에는 번역 언어가 없어도 됨)
          echo '' | ./build/mac/zhko-translate | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build app (서명 전)
        run: |
          npm ci
          # 서명은 아래 단계에서 직접 한다
          npx electron-builder --mac dir --arm64 --publish never -c.mac.identity=null
          ls -la dist/mac-arm64
      # 항상 같은 인증서로 서명해야 macOS 가 업데이트 전후를 같은 앱으로 보고 손쉬운 사용 권한을 유지한다.
      # 인증서(Secrets: MAC_CERT_P12, MAC_CERT_PASSWORD)가 없거나 서명에 실패하면 임시 서명(ad-hoc)으로 대신한다.
      - name: Sign app
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          APP=dist/mac-arm64/ZhKoStudy.app
          SIGNED=no
          if [ -n "$MAC_CERT_P12" ]; then
            KC="$RUNNER_TEMP/zhko-sign.keychain-db"
            KCPW=$(openssl rand -hex 16)
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-identity -p codesigning "$KC"
            if codesign --force --deep --timestamp=none --keychain "$KC" --sign "ZhKoStudy Signing" "$APP"; then
              SIGNED=yes
            else
              echo "::warning::인증서 서명 실패 - 임시 서명으로 대신합니다"
            fi
          else
            echo "::warning::MAC_CERT_P12 가 없어 임시 서명으로 빌드합니다"
          fi
          if [ "$SIGNED" != "yes" ]; then
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP" && echo "서명 확인 OK"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Signature|Identifier"
          codesign -dr - "$APP" 2>&1 | tail -1
          V=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/ZhKoStudy-$V-mac-arm64.zip"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/ZhKoStudy-*-mac-arm64.zip
          if-no-files-found: error

  release:
    needs: [prepare, windows, mac]
    if: always() && needs.prepare.outputs.exists == 'false' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.prepare.outputs.version }}"
          ls -R artifacts
          FILES=$(find artifacts -name 'ZhKoStudy-*.zip')
          NOTES=release-notes.md
          [ -f "$NOTES" ] || echo "버전 $V" > "$NOTES"
          if [ "${{ needs.mac.outputs.ok }}" != "yes" ] && ! echo "$FILES" | grep -q mac-arm64; then
            printf '\n\n(이번 버전은 맥 빌드에 실패해 Windows 판만 있습니다)\n' >> "$NOTES"
          fi
          gh release create "v$V" $FILES --repo "$GITHUB_REPOSITORY" --title "$V" --notes-file "$NOTES" --target "$GITHUB_SHA"
