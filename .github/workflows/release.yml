# main 에 올라온 package.json 의 버전으로 릴리스가 아직 없으면
# Windows 에서 빌드해서 GitHub 릴리스(v<버전>)를 만든다. 앱의 자동 업데이트가 이 릴리스를 받는다.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} 릴리스가 이미 있어 건너뜁니다."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.exists.outputs.found == 'false'
        shell: bash
        run: |
          npm ci
          npx electron-builder --win zip --x64 --publish never

      - name: Create release
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES=release-notes.md
          [ -f "$NOTES" ] || echo "버전 $V" > "$NOTES"
          gh release create "v$V" "dist/ZhKoStudy-$V-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$V" --notes-file "$NOTES" --target "$GITHUB_SHA"
